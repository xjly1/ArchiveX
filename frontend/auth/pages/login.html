<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        >

        <title>ArchiveX</title>

        <link
            rel="stylesheet"
            href="../styles/login.css"
        >
    </head>

    <body>
        <main>
            <div class="brand">
                <img
                    src="/ArchiveX_Logo.png"
                    alt="ArchiveX"
                >

                <h1>ArchiveX</h1>
            </div>

            <form id="loginForm">
                <div>
                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        required
                    >

                </div>
                <div>
                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                    >

                </div>

                <button type="submit">
                    تسجيل الدخول
                </button>

                <p id="error"></p>
            </form>
        </main>

        <script
            type="module"
            src="../scripts/login.js"
        ></script>
    </body>

    <script
        type="module"
        src="../../scripts/app.js"
    ></script>
</html>
